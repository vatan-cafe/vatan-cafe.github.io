:root{
  --paper:#F2F3F6; --sheet:#FFFFFF; --ink:#101828; --muted:#646B80; --line:#D9DCE4;
  --pill:#14213D; --pill-ink:#FFFFFF; --bean:#E0A526; --chip:#ECEEF3; --danger:#B42318; --ok:#2E7D4F;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1120; --sheet:#131B2E; --ink:#EEF1F6; --muted:#9097AB; --line:#222C40;
    --pill:#F0B73A; --pill-ink:#2B1D00; --bean:#F0B73A; --chip:#1A2338; --danger:#F97066; --ok:#5FC28A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1120; --sheet:#131B2E; --ink:#EEF1F6; --muted:#9097AB; --line:#222C40;
  --pill:#F0B73A; --pill-ink:#2B1D00; --bean:#F0B73A; --chip:#1A2338; --danger:#F97066; --ok:#5FC28A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Vazirmatn FD",Tahoma,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bean);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding:0 14px}

.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--pill);color:var(--pill-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:400}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);font-weight:400}
.btn:disabled{opacity:.5;cursor:default}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:16px}
textarea.input{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[dir="ltr"]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a.btn{text-decoration:none;display:inline-block}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:360px;background:var(--sheet);border:1px solid var(--line);border-radius:20px;padding:26px 22px}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
.err{color:var(--danger);font-size:14px;margin:0 0 12px;min-height:1px}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top-row{display:flex;align-items:center;gap:8px;padding:10px 0 6px}
.top-row h1{margin:0;font-size:18px;flex:1}
.top-row a,.top-row button{font-size:14px}
.tabs{display:flex;gap:4px;padding:0 0 10px}
.tab{flex:1;border:0;background:var(--chip);padding:8px;border-radius:10px;cursor:pointer;font-size:15px}
.tab[aria-selected="true"]{background:var(--pill);color:var(--pill-ink);font-weight:700}

/* Items */
.toolbar{display:flex;gap:8px;padding:14px 0 6px;align-items:center}
.toolbar .input{flex:1}
.cat-filter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 8px}
.cat-filter::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);padding:6px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.list{list-style:none;margin:0;padding:0 0 90px}
.group-title{font-size:14px;color:var(--muted);margin:16px 0 4px;font-weight:700}
.it{display:flex;align-items:center;gap:12px;padding:10px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.it-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:right;cursor:pointer}
.ph{flex:none;width:52px;height:52px;border-radius:12px;background:var(--chip);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph svg{width:22px;height:22px}
.it-text{min-width:0}
.it-name{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-meta{display:block;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:0 8px;border-radius:999px;background:var(--chip);margin-inline-start:6px}
.it.is-out .it-name{opacity:.55}

/* Availability switch */
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .15s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{right:21px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 20px rgba(16,20,31,.25);padding:12px 22px;border-radius:999px}

/* Categories */
.cat{display:flex;gap:6px;align-items:center;padding:8px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.cat .input{flex:1}
.mini{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;display:grid;place-items:center}
.mini svg{width:18px;height:18px}
.mini.del{color:var(--danger)}
.count{font-size:12px;color:var(--muted);flex:none;min-width:44px;text-align:center}
.section-pad{padding:16px 0 40px}

/* Editor sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 14px;font-size:19px}
.photo-pick{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.photo-pick .ph{width:84px;height:84px;border-radius:16px}
.photo-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.check{display:flex;align-items:center;gap:8px;margin:0 0 14px;cursor:pointer}
.check input{width:20px;height:20px}
.sheet-actions{display:flex;gap:8px;margin-top:6px}
.sheet-actions .btn:first-child{flex:1}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(40px)}to{transform:none}} }

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--pill);color:var(--pill-ink);padding:9px 18px;border-radius:12px;font-size:14px;max-width:90vw;text-align:center}
.toast.bad{background:var(--danger);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>

<!-- ───────── Login ───────── -->
<div class="login" id="loginScreen">
  <form class="login-card" id="loginForm" novalidate>
    <h1>پنل مدیریت منو</h1>
    <p>کافی شاپ وطن</p>
    <p class="err" id="loginErr" role="alert"></p>
    <label class="field"><span>ایمیل</span><input class="input" id="email" type="email" dir="ltr" autocomplete="username" required></label>
    <label class="field"><span>رمز عبور</span><input class="input" id="password" type="password" dir="ltr" autocomplete="current-password" required></label>
    <button class="btn" style="width:100%" id="loginBtn">ورود</button>
  </form>
</div>

<!-- ───────── App ───────── -->
<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <div class="top-row">
        <h1>منوی وطن</h1>
        <a class="btn ghost" href="index.html" target="_blank" rel="noopener">دیدن منو</a>
        <button class="btn ghost" id="logoutBtn">خروج</button>
      </div>

<div class="sheet-bg" id="editorBg" hidden>

<div class="toast" id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';
var cfg = window.VATAN_CONFIG || {};
var BASE = (cfg.SUPABASE_URL || '').replace(/\/+$/,'');
var KEY = cfg.SUPABASE_KEY || '';
var BUCKET = 'menu-photos';
var SESSION_KEY = 'vatan-admin-session';
var $ = function(id){ return document.getElementById(id); };
var ICON_PHOTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/></svg>';

var state = { cats: [], items: [], filter: 'all', q: '' };
var session = null;
try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){}

// ───────── helpers ─────────
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toLatin(s){ return String(s||'').replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776;}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;}).replace(/[,٬،\s]/g,''); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);})); }
var toastT;
function toast(msg, bad){ var t=$('toast'); t.textContent=msg; t.className='toast'+(bad?' bad':''); t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){t.hidden=true;}, bad?4500:2200); }
function netMsg(e){ return (e && e.message && e.message !== 'Failed to fetch') ? e.message : 'اتصال به سرور برقرار نشد. اینترنت را بررسی کنید.'; }

// ───────── Supabase (direct HTTP, no libraries) ─────────
function saveSession(s){ session = s; try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
async function authToken(body, grant){
  var r = await fetch(BASE + '/auth/v1/token?grant_type=' + grant, {
    method:'POST', headers:{ apikey: KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  var j = await r.json().catch(function(){ return {}; });
  if (!r.ok) { var e = new Error(j.error_description || j.msg || j.message || ('خطا ' + r.status)); e.status = r.status; throw e; }
  return { access_token: j.access_token, refresh_token: j.refresh_token,
           expires_at: Date.now() + ((j.expires_in || 3600) - 60) * 1000, email: j.user && j.user.email };
}
async function token(){
  if (!session) throw new Error('auth');
  if (Date.now() > session.expires_at) {
    try { saveSession(await authToken({ refresh_token: session.refresh_token }, 'refresh_token')); }
    catch(e){ if (e.status) { logout(); } throw e; }
  }
  return session.access_token;
}
async function api(path, opts){
  opts = opts || {};
  var t = await token();
  var headers = Object.assign({ apikey: KEY, Authorization: 'Bearer ' + t }, opts.headers || {});
  var r = await fetch(BASE + path, Object.assign({}, opts, { headers: headers }));
  if (r.status === 401) { logout(); throw new Error('نشست شما تمام شده. دوباره وارد شوید.'); }
  var txt = await r.text();
  var j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!r.ok) throw new Error((j && (j.message || j.error)) || ('خطا ' + r.status));
  return j;
}
function rest(path, method, body){
  return api('/rest/v1/' + path, { method: method || 'GET',
    headers: { 'Content-Type':'application/json', Prefer:'return=representation' },
    body: body ? JSON.stringify(body) : undefined });
}
function publicUrl(path){ return BASE + '/storage/v1/object/public/' + BUCKET + '/' + path; }
async function uploadPhoto(blob, path){
  await api('/storage/v1/object/' + BUCKET + '/' + path, { method:'POST',
    headers: { 'Content-Type': blob.type, 'x-upsert':'true', 'cache-control':'31536000' }, body: blob });
  return publicUrl(path);
}
function deletePhotos(paths){
  paths = paths.filter(Boolean); if (!paths.length) return Promise.resolve();
  return api('/storage/v1/object/' + BUCKET, { method:'DELETE', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ prefixes: paths }) }).catch(function(){ /* leftover file is harmless */ });
}

// Shrink photos on the phone before upload: fast menu + small storage
function compress(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var max = 1000, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w*s); h = Math.round(h*s);
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if (b && b.type === 'image/webp') return res(b);
        c.toBlob(function(b2){ b2 ? res(b2) : rej(new Error('عکس قابل پردازش نیست.')); }, 'image/jpeg', 0.82);
      }, 'image/webp', 0.8);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('این فایل عکس قابل باز شدن نیست.')); };
    img.src = url;
  });
}

// ───────── login / logout ─────────
function showApp(on){ $('loginScreen').hidden = on; $('app').hidden = !on; }
function logout(){ session = null; try{ localStorage.removeItem(SESSION_KEY); }catch(e){} showApp(false); }

$('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var err = $('loginErr'); err.textContent = '';
  if (!BASE || BASE.indexOf('YOUR-PROJECT') !== -1) { err.textContent = 'فایل config.js هنوز تنظیم نشده است.'; return; }
  var email = $('email').value.trim(), pass = $('password').value;
  if (!email || !pass) { err.textContent = 'ایمیل و رمز عبور را وارد کنید.'; return; }
  $('loginBtn').disabled = true;
  try {
    saveSession(await authToken({ email: email, password: pass }, 'password'));
    $('password').value = '';
    showApp(true); loadAll();
  } catch(ex) {
    err.textContent = ex.status === 400 ? 'ایمیل یا رمز عبور اشتباه است.' : netMsg(ex);
  } finally { $('loginBtn').disabled = false; }
});
$('logoutBtn').addEventListener('click', logout);

// ───────── tabs ─────────
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected', x === t); });
    ['items','cats','info'].forEach(function(n){ $('tab-' + n).hidden = n !== t.dataset.tab; });
    window.scrollTo(0,0);
  });
});

// ───────── load ─────────
async function loadAll(){
  try {
    var res = await Promise.all([
      rest('categories?select=*&order=sort.asc,created_at.asc'),
      rest('items?select=*&order=sort.asc,created_at.asc'),
      rest('settings?select=*&id=eq.1')
    ]);
    state.cats = res[0]; state.items = res[1];
    var s = res[2][0] || {};
    var f = $('infoForm');
    ['price_note','hours','address','wifi','instagram'].forEach(function(k){ f.elements[k].value = s[k] || ''; });
    renderItems(); renderCats();
  } catch(e){ if (session) toast(netMsg(e), true); }
}

// ───────── items tab ─────────
function catName(id){ var c = state.cats.find(function(x){return x.id===id;}); return c ? c.name : ''; }
function priceText(it){ return it.price2 != null ? it.price + ' / ' + it.price2 : String(it.price == null ? '' : it.price); }

function renderItems(){
  var fc = '<button class="chip" data-c="all" aria-pressed="'+(state.filter==='all')+'">همه</button>';
  state.cats.forEach(function(c){ fc += '<button class="chip" data-c="'+c.id+'" aria-pressed="'+(state.filter===c.id)+'">'+esc(c.name)+'</button>'; });
  $('catFilter').innerHTML = fc;

  var q = state.q.replace(/ي/g,'ی').replace(/ك/g,'ک').trim();
  var html = '', count = 0;
  state.cats.forEach(function(c){
    if (state.filter !== 'all' && state.filter !== c.id) return;
    var list = state.items.filter(function(it){ return it.category_id === c.id && (!q || it.name.indexOf(q) !== -1); });
    if (!list.length) return;
    html += '<li class="group-title">'+esc(c.name)+'</li>';
    list.forEach(function(it){
      count++;
      html += '<li class="it'+(it.available?'':' is-out')+'">' +
        '<button class="it-open" data-id="'+it.id+'"><span class="ph">'+(it.photo_url?'<img src="'+esc(it.photo_url)+'" alt="" loading="lazy">':ICON_PHOTO)+'</span>' +
        '<span class="it-text"><span class="it-name">'+esc(it.name)+'</span><span class="it-meta">'+esc(priceText(it))+
        (it.hidden?'<span class="tag">پنهان</span>':'')+'</span></span></button>' +
        '<label class="sw"><input type="checkbox" data-avail="'+it.id+'"'+(it.available?' checked':'')+' aria-label="موجود بودن '+esc(it.name)+'">'+(it.available?'موجود':'تمام شد')+'</label></li>';
    });
  });
  $('itemList').innerHTML = count ? html : '<li class="empty">'+(q?'آیتمی پیدا نشد.':'هنوز آیتمی نیست. با دکمهٔ «افزودن آیتم» شروع کنید.')+'</li>';
}

$('catFilter').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if(!b) return; state.filter = b.dataset.c; renderItems(); });
$('search').addEventListener('input', function(){ state.q = this.value; renderItems(); });

// Sold-out switch: saves instantly
$('itemList').addEventListener('change', async function(e){
  var id = e.target.dataset.avail; if (!id) return;
  var it = state.items.find(function(x){return x.id===id;}); var val = e.target.checked;
  it.available = val; renderItems();
  try { await rest('items?id=eq.' + id, 'PATCH', { available: val }); toast(val ? 'موجود شد' : 'تمام‌شده علامت خورد'); }
  catch(ex){ it.available = !val; renderItems(); toast(netMsg(ex), true); }
});
$('itemList').addEventListener('click', function(e){
  var b = e.target.closest('.it-open'); if (!b) return;
  openEditor(state.items.find(function(x){return x.id===b.dataset.id;}));
});
$('addItemBtn').addEventListener('click', function(){
  if (!state.cats.length) { toast('اول در تب «دسته‌ها» یک دسته بسازید.', true); return; }
  openEditor(null);
});

// ───────── editor ─────────
var ed = { item: null, newBlob: null, removePhoto: false, previewUrl: null };
function setPh(src){ $('edPh').innerHTML = src ? '<img src="'+esc(src)+'" alt="">' : ICON_PHOTO; $('edRemovePhoto').hidden = !src; }

function openEditor(item){
  ed = { item: item, newBlob: null, removePhoto: false, previewUrl: null };
  $('edTitle').textContent = item ? 'ویرایش آیتم' : 'آیتم جدید';
  $('edCat').innerHTML = state.cats.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join('');
  $('edName').value = item ? item.name : '';
  $('edDesc').value = item ? item.description : '';
  $('edCat').value = item ? item.category_id : (state.filter !== 'all' ? state.filter : state.cats[0].id);
  $('edPrice').value = item && item.price != null ? item.price : '';
  $('edPrice2').value = item && item.price2 != null ? item.price2 : '';
  $('edAvail').checked = item ? item.available : true;
  $('edHidden').checked = item ? item.hidden : false;
  $('edDelete').hidden = !item;
  $('edErr').textContent = '';
  $('edFile').value = '';
  setPh(item && item.photo_url);
  $('editorBg').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeEditor(){
  if (ed.previewUrl) URL.revokeObjectURL(ed.previewUrl);
  $('editorBg').hidden = true; document.body.style.overflow = '';
}
$('edCancel').addEventListener('click', closeEditor);
$('editorBg').addEventListener('click', function(e){ if (e.target === this) closeEditor(); });

$('edFile').addEventListener('change', async function(){
  var f = this.files[0]; if (!f) return;
  $('edErr').textContent = '';
  try {
    ed.newBlob = await compress(f); ed.removePhoto = false;
    if (ed.previewUrl) URL.revokeObjectURL(ed.previewUrl);
    ed.previewUrl = URL.createObjectURL(ed.newBlob); setPh(ed.previewUrl);
  } catch(ex){ $('edErr').textContent = ex.message; }
});
$('edRemovePhoto').addEventListener('click', function(){ ed.newBlob = null; ed.removePhoto = true; setPh(null); });

$('editor').addEventListener('submit', async function(e){
  e.preventDefault();
  var err = $('edErr'); err.textContent = '';
  var name = $('edName').value.trim();
  var p1 = toLatin($('edPrice').value), p2 = toLatin($('edPrice2').value);
  if (!name) { err.textContent = 'نام آیتم را وارد کنید.'; return; }
  if (!/^\d+$/.test(p1)) { err.textContent = 'قیمت را فقط با عدد وارد کنید.'; return; }
  if (p2 && !/^\d+$/.test(p2)) { err.textContent = 'قیمت دوم را فقط با عدد وارد کنید یا خالی بگذارید.'; return; }

  var item = ed.item, id = item ? item.id : uid();
  var row = { name: name, description: $('edDesc').value.trim(), category_id: $('edCat').value,
    price: +p1, price2: p2 ? +p2 : null, available: $('edAvail').checked, hidden: $('edHidden').checked };
  var oldPath = item && item.photo_path;

  $('edSave').disabled = true; $('edSave').textContent = 'در حال ذخیره…';
  try {
    if (ed.newBlob) {
      var path = 'items/' + id + '-' + Date.now() + (ed.newBlob.type === 'image/webp' ? '.webp' : '.jpg');
      row.photo_url = await uploadPhoto(ed.newBlob, path); row.photo_path = path;
    } else if (ed.removePhoto) { row.photo_url = null; row.photo_path = null; }

    if (item) {
      var upd = await rest('items?id=eq.' + id, 'PATCH', row);
      Object.assign(item, upd[0]);
    } else {
      var sameCat = state.items.filter(function(x){ return x.category_id === row.category_id; });
      row.id = id; row.sort = sameCat.reduce(function(m,x){ return Math.max(m, x.sort); }, -1) + 1;
      var ins = await rest('items', 'POST', row);
      state.items.push(ins[0]);
    }
    if ((ed.newBlob || ed.removePhoto) && oldPath) deletePhotos([oldPath]);
    closeEditor(); renderItems(); toast(item ? 'ذخیره شد' : 'آیتم اضافه شد');
  } catch(ex){ err.textContent = netMsg(ex); }
  finally { $('edSave').disabled = false; $('edSave').textContent = 'ذخیره'; }
});

$('edDelete').addEventListener('click', async function(){
  var item = ed.item; if (!item) return;
  if (!confirm('«' + item.name + '» برای همیشه حذف شود؟')) return;
  try {
    await rest('items?id=eq.' + item.id, 'DELETE');
    deletePhotos([item.photo_path]);
    state.items = state.items.filter(function(x){ return x.id !== item.id; });
    closeEditor(); renderItems(); toast('حذف شد');
  } catch(ex){ $('edErr').textContent = netMsg(ex); }
});

// ───────── categories tab ─────────
var UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>';
var DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

function renderCats(){
  $('catList').innerHTML = state.cats.map(function(c, i){
    var n = state.items.filter(function(x){ return x.category_id === c.id; }).length;
    return '<div class="cat"><input class="input" data-rename="'+c.id+'" value="'+esc(c.name)+'" aria-label="نام دسته">' +
      '<span class="count">'+n+' آیتم</span>' +
      '<button class="mini" data-move="'+i+'" data-dir="-1" aria-label="بالاتر"'+(i===0?' disabled':'')+'>'+UP+'</button>' +
      '<button class="mini" data-move="'+i+'" data-dir="1" aria-label="پایین‌تر"'+(i===state.cats.length-1?' disabled':'')+'>'+DOWN+'</button>' +
      '<button class="mini del" data-del="'+c.id+'" aria-label="حذف دسته">'+TRASH+'</button></div>';
  }).join('') || '<p class="empty">هنوز دسته‌ای نیست.</p>';
}

// rename on leaving the field
$('catList').addEventListener('change', async function(e){
  var id = e.target.dataset.rename; if (!id) return;
  var c = state.cats.find(function(x){return x.id===id;}); var name = e.target.value.trim();
  if (!name) { e.target.value = c.name; return; }
  try { await rest('categories?id=eq.' + id, 'PATCH', { name: name }); c.name = name; renderItems(); toast('نام دسته ذخیره شد'); }
  catch(ex){ e.target.value = c.name; toast(netMsg(ex), true); }
});

$('catList').addEventListener('click', async function(e){
  var mv = e.target.closest('[data-move]'), del = e.target.closest('[data-del]');
  if (mv) {
    var i = +mv.dataset.move, j = i + (+mv.dataset.dir);
    var a = state.cats; var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    renderCats(); renderItems();
    try { await Promise.all(a.map(function(c, k){ c.sort = k; return rest('categories?id=eq.' + c.id, 'PATCH', { sort: k }); })); }
    catch(ex){ toast(netMsg(ex), true); loadAll(); }
  }
  if (del) {
    var c = state.cats.find(function(x){return x.id===del.dataset.del;});
    var inCat = state.items.filter(function(x){ return x.category_id === c.id; });
    var msg = inCat.length ? 'دستهٔ «'+c.name+'» و '+inCat.length+' آیتم داخل آن برای همیشه حذف شوند؟' : 'دستهٔ «'+c.name+'» حذف شود؟';
    if (!confirm(msg)) return;
    try {
      await rest('categories?id=eq.' + c.id, 'DELETE');
      deletePhotos(inCat.map(function(x){ return x.photo_path; }));
      state.cats = state.cats.filter(function(x){ return x !== c; });
      state.items = state.items.filter(function(x){ return x.category_id !== c.id; });
      if (state.filter === c.id) state.filter = 'all';
      renderCats(); renderItems(); toast('دسته حذف شد');
    } catch(ex){ toast(netMsg(ex), true); }
  }
});

$('addCatForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var name = $('newCat').value.trim(); if (!name) return;
  try {
    var sort = state.cats.reduce(function(m,x){ return Math.max(m, x.sort); }, -1) + 1;
    var ins = await rest('categories', 'POST', { name: name, sort: sort });
    state.cats.push(ins[0]); $('newCat').value = '';
    renderCats(); renderItems(); toast('دسته اضافه شد');
  } catch(ex){ toast(netMsg(ex), true); }
});

// ───────── cafe info tab ─────────
$('infoForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var f = this, row = { id: 1 };
  ['price_note','hours','address','wifi','instagram'].forEach(function(k){ row[k] = f.elements[k].value.trim(); });
  row.instagram = row.instagram.replace(/^@/,'');
  $('infoSave').disabled = true;
  try {
    await api('/rest/v1/settings', { method:'POST',
      headers:{ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(row) });
    toast('اطلاعات کافه ذخیره شد');
  } catch(ex){ toast(netMsg(ex), true); }
  finally { $('infoSave').disabled = false; }
});

// ───────── start ─────────
if (session) { showApp(true); loadAll(); } else { showApp(false); }
})();
</script>
</body>
</html>
