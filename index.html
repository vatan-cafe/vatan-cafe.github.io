:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#101828; --muted:#667085; --hair:#E6E8EC;
  --brand:#14213D; --brand-ink:#FFFFFF; --brand-soft:rgba(255,255,255,.72);
  --saffron:#E0A526; --saffron-ink:#3D2A00; --chip-ink:#344054;
  --glass:rgba(242,243,246,.78); --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --surface:#131B2E; --ink:#EEF1F6; --muted:#98A2B3; --hair:#222C40;
    --brand:#16233F; --brand-ink:#FFFFFF; --brand-soft:rgba(255,255,255,.66);
    --saffron:#F0B73A; --saffron-ink:#2B1D00; --chip-ink:#C9D0DC;
    --glass:rgba(11,17,32,.78); --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#131B2E; --ink:#EEF1F6; --muted:#98A2B3; --hair:#222C40;
  --brand:#16233F; --brand-ink:#FFFFFF; --brand-soft:rgba(255,255,255,.66);
  --saffron:#F0B73A; --saffron-ink:#2B1D00; --chip-ink:#C9D0DC;
  --glass:rgba(11,17,32,.78); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn FD",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:8px}
[dir="ltr"]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

/* ── Hero: the one bold moment ── */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:0 0 28px 28px;overflow:hidden;position:relative}
.hero-in{max-width:720px;margin:0 auto;padding:34px 22px 26px;position:relative}
.wordmark{direction:ltr;margin:0;font-weight:200;font-size:clamp(64px,22vw,120px);line-height:.9;
  letter-spacing:-.035em;position:relative;display:inline-block}
.wordmark::after{content:"";position:absolute;left:-10%;right:-12%;top:52%;height:2px;border-radius:2px;
  background:var(--saffron);transform:rotate(-21deg)}
.hero h1{margin:14px 0 0;font-size:24px;font-weight:700;line-height:1.3}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.hero-meta li{font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--brand-soft)}
.hero-meta li.warn{background:var(--saffron);color:var(--saffron-ink)}

/* ── Frosted category bar ── */
.bar{position:sticky;top:0;z-index:20;background:var(--glass);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s}
.bar.stuck{border-bottom-color:var(--hair)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 12px}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;color:var(--chip-ink);padding:7px 14px;border-radius:999px;
  font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-current="true"]{background:var(--brand);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip[aria-current="true"]{background:var(--saffron);color:var(--saffron-ink)} }
:root[data-theme="dark"] .chip[aria-current="true"]{background:var(--saffron);color:var(--saffron-ink)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.search{max-width:720px;margin:0 auto;padding:0 12px 12px;display:none}
.search.open{display:block}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1px solid var(--hair);
  background:var(--surface);color:var(--ink);outline:none}
.search input:focus{border-color:var(--saffron)}

/* ── Menu ── */
main{max-width:720px;margin:0 auto;padding:4px 14px 28px}
.section{padding-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 6px 10px}
.sec-head h2{margin:0;font-size:21px;font-weight:700;line-height:1.3}
.sec-head h2::before{content:"";display:inline-block;width:4px;height:16px;border-radius:2px;background:var(--saffron);
  margin-inline-end:10px;vertical-align:-1px}
.sec-head span{font-size:13px;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 16px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair)}
.item:last-child{border-bottom:0}
.thumb{flex:none;width:68px;height:68px;border-radius:16px;background:var(--bg);border:0;padding:0;cursor:zoom-in;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{margin:0;font-size:16px;font-weight:700;line-height:1.5}
.desc{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.65}
.price{flex:none;text-align:left;font-size:16px;font-weight:700;white-space:nowrap}
.price small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:-2px}
.item.out .name,.item.out .desc,.item.out .thumb{opacity:.45}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:56px 0}

/* ── Footer ── */
footer{max-width:720px;margin:0 auto;padding:8px 14px 40px}
.info-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px 18px;margin:0 0 18px}
.info-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--hair);font-size:14px}
.info-row:last-child{border-bottom:0}
.info-row svg{flex:none;width:18px;height:18px;margin-top:3px;color:var(--saffron)}
.info-row b{display:block;font-size:12px;color:var(--muted);font-weight:400}
.sign{text-align:center;color:var(--muted);font-size:12px;margin:0}

/* ── Photo viewer ── */
.viewer{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.7);display:none;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.viewer.open{display:flex}
.viewer-card{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer-card img{width:100%;aspect-ratio:4/3;object-fit:cover}
.viewer-body{padding:16px 20px 24px;display:flex;gap:12px;align-items:flex-start}
.viewer-body .info{flex:1}
@media (prefers-reduced-motion:no-preference){
  .viewer.open .viewer-card{animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <p class="wordmark" aria-hidden="true">VATAN</p>
    <h1>کافی شاپ وطن</h1>
    <ul class="hero-meta" id="heroMeta"></ul>
  </div>
</header>

<nav class="bar" id="bar" aria-label="دسته‌بندی‌ها">
  <div class="bar-inner">

<script>
(function(){
  var fallback = JSON.parse(document.getElementById('menu-data').textContent);
  var data = null;
  var menuEl = document.getElementById('menu');
  var chipsEl = document.getElementById('chips');
  var barEl = document.getElementById('bar');
  var cfg = window.VATAN_CONFIG || {};
  var CACHE_KEY = 'vatan-menu-v1';
  var configured = cfg.SUPABASE_URL && cfg.SUPABASE_URL.indexOf('YOUR-PROJECT') === -1;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtPrice(p){ return Array.isArray(p) ? p.join(' / ') : String(p); }
  function norm(s){ return String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ').trim().toLowerCase(); }
  var ICON = {
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.2" r=".9" fill="currentColor"/></svg>',
    ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor"/></svg>'
  };

  function render(filter){
    if (!data) return;
    var q = norm(filter);
    var html = '', chips = '', any = false;
    data.categories.forEach(function(cat){
      var items = data.items.filter(function(it){
        if (it.category !== cat.id || it.hidden) return false;
        return !q || norm(it.name + ' ' + (it.desc||'')).indexOf(q) !== -1;
      });
      if (!items.length) return;
      any = true;
      chips += '<button class="chip" data-target="c-'+esc(cat.id)+'">'+esc(cat.name)+'</button>';
      html += '<section class="section" id="c-'+esc(cat.id)+'"><div class="sec-head"><h2>'+esc(cat.name)+'</h2><span>'+items.length+' مورد</span></div><ul class="items">';
      items.forEach(function(it){
        var out = it.available === false;
        html += '<li class="item'+(out?' out':'')+'">' +
          (it.photo ? '<button class="thumb" data-id="'+esc(it.id)+'" aria-label="عکس '+esc(it.name)+'"><img src="'+esc(it.photo)+'" alt="" loading="lazy"></button>' : '') +
          '<div class="info"><p class="name">'+esc(it.name)+'</p>' + (it.desc ? '<p class="desc">'+esc(it.desc)+'</p>' : '') + '</div>' +
          (out ? '<span class="badge">تمام شد</span>' : '<span class="price">'+esc(fmtPrice(it.price))+'</span>') + '</li>';
      });
      html += '</ul></section>';
    });
    menuEl.innerHTML = any ? html : '<p class="empty">موردی با «'+esc(filter)+'» پیدا نشد.</p>';
    chipsEl.innerHTML = chips;
    current = null; sections = Array.prototype.slice.call(menuEl.querySelectorAll('.section'));
    spy();
  }

  // ── Category tracking (no page movement; only the tab bar slides sideways) ──
  var sections = [], current = null, ticking = false, lockUntil = 0;
  function setActive(id){
    if (id === current) return;
    current = id;
    var active = null;
    chipsEl.querySelectorAll('.chip').forEach(function(c){
      var on = c.dataset.target === id;
      c.setAttribute('aria-current', on ? 'true' : 'false');
      if (on) active = c;
    });
    if (active) {
      var a = active.getBoundingClientRect(), s = chipsEl.getBoundingClientRect();
      var delta = (a.left + a.width/2) - (s.left + s.width/2);
      if (Math.abs(delta) > 4) chipsEl.scrollBy({ left: delta, behavior: reduce ? 'auto' : 'smooth' });
    }
  }
  function spy(){
    ticking = false;
    if (barEl) barEl.classList.toggle('stuck', barEl.getBoundingClientRect().top <= 0 && window.scrollY > 10);
    if (!sections.length || Date.now() < lockUntil) return;
    var doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 2) return setActive(sections[sections.length-1].id);
    var line = (barEl ? barEl.getBoundingClientRect().bottom : 0) + 24, id = sections[0].id;
    for (var i = 0; i < sections.length; i++) {
      if (sections[i].getBoundingClientRect().top <= line) id = sections[i].id; else break;
    }
    setActive(id);
  }
  window.addEventListener('scroll', function(){ if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, {passive:true});
  window.addEventListener('resize', spy);

  // Tap a tab → jump to that section (tracking pauses during the jump so tabs don't flicker)
  chipsEl.addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    var t = document.getElementById(b.dataset.target); if (!t) return;
    setActive(b.dataset.target);
    lockUntil = Date.now() + (reduce ? 50 : 700);
    t.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
    setTimeout(spy, reduce ? 60 : 720);
  });

  // Search
  var sBtn = document.getElementById('searchBtn'), sBox = document.getElementById('searchBox'), qIn = document.getElementById('q');
  sBtn.addEventListener('click', function(){
    var open = !sBox.classList.contains('open');
    sBox.classList.toggle('open', open);
    sBtn.setAttribute('aria-expanded', open);
    if (open) qIn.focus(); else { qIn.value=''; render(''); }
  });
  qIn.addEventListener('input', function(){ render(qIn.value); });

  // Photo viewer
  var viewer = document.getElementById('viewer');
  menuEl.addEventListener('click', function(e){
    var b = e.target.closest('.thumb'); if(!b) return;
    var it = data.items.find(function(x){return x.id===b.dataset.id;}); if(!it) return;
    document.getElementById('vImg').src = it.photo;
    document.getElementById('vName').textContent = it.name;
    document.getElementById('vDesc').textContent = it.desc || '';
    document.getElementById('vPrice').textContent = it.available === false ? 'تمام شد' : fmtPrice(it.price);
    viewer.classList.add('open');
  });
  viewer.addEventListener('click', function(){ viewer.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') viewer.classList.remove('open'); });

  function renderChrome(note){
    var c = data.cafe, m = '';
    if (c.priceNote) m += '<li>'+esc(c.priceNote)+'</li>';
    if (c.hours) m += '<li>'+esc(c.hours)+'</li>';
    if (note) m += '<li class="warn">'+esc(note)+'</li>';
    document.getElementById('heroMeta').innerHTML = m;

    var rows = '';
    function row(icon, label, value, ltr){ rows += '<div class="info-row">'+ICON[icon]+'<div><b>'+label+'</b>'+(ltr?'<span dir="ltr">'+value+'</span>':value)+'</div></div>'; }
    if (c.hours) row('clock','ساعت کاری',esc(c.hours));
    if (c.address) row('pin','آدرس',esc(c.address));
    if (c.wifi) row('wifi','رمز وای‌فای',esc(c.wifi),true);
    if (c.instagram) row('ig','اینستاگرام','@'+esc(String(c.instagram).replace(/^@/,'')),true);
    document.getElementById('foot').innerHTML = (rows ? '<div class="info-card">'+rows+'</div>' : '') + '<p class="sign">کافی شاپ وطن</p>';
  }

  function start(d, note){
    data = d;
    renderChrome(note);
    render(qIn.value || '');
  }

  function fromDb(cats, items, settings){
    var s = settings[0] || {};
    return {
      cafe: { priceNote: s.price_note || '', hours: s.hours || '', address: s.address || '', wifi: s.wifi || '', instagram: s.instagram || '' },
      categories: cats.map(function(c){ return { id: c.id, name: c.name }; }),
      items: items.map(function(i){
        return { id: i.id, category: i.category_id, name: i.name, desc: i.description,
          price: i.price2 != null ? [i.price, i.price2] : i.price,
          photo: i.photo_url, available: i.available, hidden: i.hidden };
      })
    };
  }
  function get(path){
    return fetch(cfg.SUPABASE_URL.replace(/\/+$/,'') + '/rest/v1/' + path, { headers: { apikey: cfg.SUPABASE_KEY }, cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}
  if (!configured) { start(fallback); return; }
  if (cached) start(cached);
  else menuEl.innerHTML = '<p class="empty">در حال بارگذاری منو…</p>';

  Promise.all([
    get('categories?select=id,name,sort&order=sort.asc,created_at.asc'),
    get('items?select=*&order=sort.asc,created_at.asc'),
    get('settings?select=*&id=eq.1')
  ]).then(function(res){
    var live = fromDb(res[0], res[1], res[2]);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(live)); } catch(e){}
    var y = window.scrollY;
    start(live);
    if (cached) window.scrollTo(0, y);
  }).catch(function(){
    if (cached) start(cached, 'نسخهٔ ذخیره‌شده');
    else start(fallback, 'ممکن است قیمت‌ها به‌روز نباشد');
  });
})();
</script>
